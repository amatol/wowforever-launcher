name: Launcher

# Сборка Windows-лаунчера Forever AI.
# Публичный CA уже лежит в app/src-tauri/resources/forever_root_ca.crt.
# Переменные репозитория (не секреты), если нужно переопределить:
#   FOREVER_SERVER_ADDRESS  — IP/домен сервера (по умолчанию 92.42.44.9)
#   FOREVER_SERVER_NAME     — название мира (по умолчанию Дримворлд)
#   FOREVER_WEBSITE         — https://forever.mmolabs.ru/launcher
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например 1.0.0); пусто = только сборка"
        required: false
        default: ""
  push:
    tags: ["v*"]

env:
  FOREVER_CA_CERT: ${{ vars.FOREVER_CA_CERT }}
  FOREVER_SERVER_ADDRESS: ${{ vars.FOREVER_SERVER_ADDRESS }}
  FOREVER_WEBSITE: ${{ vars.FOREVER_WEBSITE }}
  FOREVER_SERVER_NAME: ${{ vars.FOREVER_SERVER_NAME }}
  VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Build
        working-directory: app
        shell: bash
        run: |
          version="${VERSION#v}"
          config=()
          [ -n "$version" ] && config=(--config "{\"version\":\"$version\"}")
          npx --yes @tauri-apps/cli@2 build --bundles nsis "${config[@]}"
          cp src-tauri/target/release/forever-ai-launcher.exe "src-tauri/target/release/Forever AI.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: DreamworldForever-Launcher-Windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/Forever*.exe
          if-no-files-found: error

  release:
    if: inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          find dist -type f -exec cp -v {} release/ \;
          ls -lh release

      - name: Release tag
        shell: bash
        run: |
          v="${VERSION#v}"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Дримворлд Навсегда ${{ env.TAG }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
